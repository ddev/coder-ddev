name: Push Image

# Builds linux/amd64 on GitHub-hosted runners (native amd64) so arm64 dev
# machines don't need cross-compilation. Triggered manually only.
#
# Required repository secrets:
#   PUSH_SERVICE_ACCOUNT_TOKEN - 1Password service account with push-secrets vault access
# Required repository variables:
#   DOCKERHUB_USERNAME - Docker Hub username
# Required 1Password item:
#   op://push-secrets/DOCKERHUB_TOKEN/credential

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: Enable remote debugging session
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Load 1Password secrets
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.PUSH_SERVICE_ACCOUNT_TOKEN }}
          DOCKERHUB_TOKEN: "op://push-secrets/DOCKERHUB_TOKEN/credential"

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: image
          platforms: linux/amd64
          push: true
          tags: |
            ddev/coder-ddev:${{ steps.version.outputs.version }}
            ddev/coder-ddev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
