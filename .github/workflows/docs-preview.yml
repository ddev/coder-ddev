name: Docs PR Preview

# Deploys a preview of the /docs site to gh-pages at /pr-preview/pr-N/
# and posts a comment with the URL on each PR.
# On PR close, removes the preview automatically.
#
# Preview URLs: https://start.coder.ddev.com/pr-preview/pr-<N>/

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        if: github.event.action != 'closed'
        with:
          source: ./docs
          destination: ./_site

      - name: Point preview at staging-coder.ddev.com
        if: github.event.action != 'closed'
          cp -r ./_site ./_site_preview
          find ./_site_preview -name "*.html" -exec sed -i 's|https://coder\.ddev\.com|https://staging-coder.ddev.com|g' {} +
          chmod -R a+w ./_site
          find ./_site -name "*.html" -exec sed -i 's|https://coder\.ddev\.com|https://staging-coder.ddev.com|g' {} +

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site_preview
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          token: ${{ secrets.GITHUB_TOKEN }}
          action: auto
